name: Corpus

on:
  schedule:
    - cron: "0 3 * * *" # nightly
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  corpus:
    name: parser corpus test
    runs-on: ubuntu-latest
    # Issue #12: `cargo xtask corpus` is implemented and this is now a
    # real signal. `corpus test` runs non-strict here (its default): a
    # panic or a per-file timeout fails the job; false positives (Outou
    # diagnostics on plain Rust) and splice round-trip mismatches are
    # reported in the job's own summary and in `.corpus/report.json`
    # without failing it — see that report for counts (Gate 4 tracks
    # them, not this nightly job).
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: .corpus
          key: corpus-${{ hashFiles('corpus.lock') }}
      - run: cargo xtask corpus fetch
      - run: cargo xtask corpus test
