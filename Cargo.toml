[workspace]
resolver = "2"
members = ["crates/*", "xtask"]
# Independent Cargo projects. They are not part of the framework build:
#   - spikes/rust-analyzer/fixture: hand-written rust-analyzer feasibility spike
#   - examples/phase0-app: `.rsx` sources that cannot build until Gate 2
exclude = ["spikes/rust-analyzer/fixture", "examples/phase0-app"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/outou-rs/outou"
homepage = "https://github.com/outou-rs/outou"
# MSRV: the highest MSRV among direct dependencies (clap 4.6 requires 1.85).
rust-version = "1.85"
authors = ["Outou contributors"]
categories = ["development-tools", "gui", "wasm"]
keywords = ["jsx", "rust", "ui", "wasm"]

[workspace.dependencies]
# Internal crates (lockstep versioning).
outou = { version = "0.0.1", path = "crates/outou" }
outou-syntax = { version = "0.0.1", path = "crates/outou-syntax" }
outou-sourcemap = { version = "0.0.1", path = "crates/outou-sourcemap" }
outou-codegen = { version = "0.0.1", path = "crates/outou-codegen" }
outou-backend-dioxus = { version = "0.0.1", path = "crates/outou-backend-dioxus" }
outou-modules = { version = "0.0.1", path = "crates/outou-modules" }
outou-cli = { version = "0.0.1", path = "crates/outou-cli" }

# External. `dioxus` is only ever depended on by the `outou` facade crate.
dioxus = { version = "0.7.10", default-features = false, features = ["macro", "html", "signals", "hooks"] }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# `outou-lsp` only: the language-server scaffold rust-analyzer itself uses
# (sync, `lsp_server::Message::read`/`write` frames JSON-RPC over any
# `BufRead`/`Write`, which lets `outou-lsp` reuse it for both the editor
# connection and its own rust-analyzer child process) and its type
# definitions.
lsp-server = "0.10"
lsp-types = "0.97"
crossbeam-channel = "0.5"
# Dev-only, everywhere it appears: parses generated Rust back to check it is
# syntactically valid (recovery-mode tests). Never a normal dependency.
syn = { version = "2", features = ["full", "parsing"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
todo = "allow"
