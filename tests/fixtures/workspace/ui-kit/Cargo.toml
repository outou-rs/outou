[package]
name = "ui-kit"
version = "0.0.1"
edition = "2021"
description = "Outou Phase 0 workspace-fixture library, written in `.rsx` (issue #10)."
license = "MIT OR Apache-2.0"

# A library: ADR 0008 says published crates ship pre-generated Rust, so
# `src/.generated/` is committed (see the repository root `.gitignore`'s
# negation for this path) instead of ignored the way an application's is.
[lib]
path = "src/.generated/crate-root.rs"

# No `[package] include`: `cargo package --list -p ui-kit` already ships
# `src/.generated/` without one. Cargo's default file list for a crate
# inside a git repository is VCS-aware (tracked files, honoring
# `.gitignore`), and the repository root `.gitignore`'s negation for this
# exact path (`!tests/fixtures/workspace/ui-kit/src/.generated/`) makes
# these files tracked like any other, so no `include` override is needed
# — confirmed with `cargo package --list -p ui-kit`, which lists
# `src/.generated/crate-root.rs` and friends (`crates/outou-cli/tests/matrix.rs`).
#
# An earlier version of this comment (and `crates/outou-cli/README.md`,
# `docs/phase0/issues/10-cargo-matrix.md`) claimed Cargo unconditionally
# drops dot-prefixed paths even with an explicit `include`. That was
# false, and specific to how `crates/outou-cli/tests/matrix.rs` used to
# exercise this fixture: its `copy_to_temp`/`copy_dir` helper made a
# plain filesystem copy with no `.git` directory at all, so
# `cargo package --list` ran there under Cargo's separate "no VCS found"
# fallback file listing, which — in cargo 1.98.1 — does drop
# dot-prefixed paths regardless of `include`. That fallback path is not
# what a real `cargo publish` from this repository (or from a real
# consumer's checkout) ever goes through, since a published crate's
# source lives in a git repository. `matrix.rs` now makes its temp copy
# a git working tree with the same ignore rules as this repository
# before packaging, so the check exercises the real code path.
#
# The genuine Phase 0 publish limitation is different, and is resolved
# (issue #15, `crates/outou-cli/README.md`'s `outou package` section): a
# *standalone* `cargo publish --dry-run --allow-dirty -p ui-kit` still
# fails with "no matching package named `outou` found ... location
# searched: crates.io index", because `ui-kit` depends on `outou` via a
# local `path` dependency and `outou` itself has not been published to
# crates.io. But `outou` and `ui-kit` are always published *together* in
# practice, and packaging several inter-dependent crates in one `cargo
# package`/`publish` invocation makes Cargo build the temporary lockfile
# on the assumption that all of them land on the same registry together
# — so `cargo publish -p outou -p ui-kit` (not `-p ui-kit` alone)
# resolves this `path` dependency and succeeds. See
# `outou_and_ui_kit_publish_dry_run_succeeds_together` in
# `crates/outou-cli/tests/matrix.rs`.

[dependencies]
# `version` alongside `path`, exactly like the repository root
# `Cargo.toml`'s own `[workspace.dependencies]`: `cargo publish` refuses
# to package a crate whose path dependency has no version requirement
# (the published crate cannot embed a `path` that only exists on this
# machine).
outou = { path = "../../../../crates/outou", version = "0.0.1" }

[features]
extra = []
